# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "LIZZIE MARTIN"                          # Your name
  description: "PhD Candidate in Political Science & Communication"   # A brief slogan (optional)
  image: img/headshot.jpg
  
  #favicon: img/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    #logo: /img/logo.png
    
    # your sub-pages
    left:
      - text: "Research & Writing"
        href: research/index.qmd
      - text: "CV"
        href: cv/index.qmd
    
    # your social media handles
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=pXhXTJsAAAAJ&hl=en
      - icon: linkedin
        href: https://www.linkedin.com/in/lizzie-martin-9b8998204/
      - icon: journal-bookmark-fill
        href: https://orcid.org/0000-0002-3465-0621
      - icon: envelope
        aria-label: email
        href: "mailto:lizzie.martin@asc.upenn.edu"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true